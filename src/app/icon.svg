<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon — aproximação simplificada do logo Mr. Dave Idiomas.
  4 setores coloridos no anel + miolo preto + "MD" centralizado.
  Para troca pelo arquivo oficial: salve um PNG/SVG melhor com este
  mesmo nome (src/app/icon.svg) ou substitua por src/app/icon.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 4 quadrantes coloridos (top=vermelho, right=azul, bottom=verde, left=laranja) -->
  <g>
    <path d="M32 4 A28 28 0 0 1 60 32 L32 32 Z" fill="#dc2626"/>
    <path d="M60 32 A28 28 0 0 1 32 60 L32 32 Z" fill="#2563eb"/>
    <path d="M32 60 A28 28 0 0 1 4 32 L32 32 Z" fill="#16a34a"/>
    <path d="M4 32 A28 28 0 0 1 32 4 L32 32 Z" fill="#f97316"/>
  </g>
  <!-- Miolo preto -->
  <circle cx="32" cy="32" r="21" fill="#0d0d0d"/>
  <!-- "MD" branco centralizado -->
  <text x="32" y="40"
        text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-weight="800"
        font-size="18"
        fill="#ffffff">MD</text>
</svg>
